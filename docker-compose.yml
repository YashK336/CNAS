services:
  postgres:
    image: postgres:16-alpine
    container_name: cnas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cnas
      POSTGRES_PASSWORD: cnas
      POSTGRES_DB: cnas
    ports:
      - "5432:5432"
    volumes:
      - cnas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnas -d cnas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cnas_pg_data:
